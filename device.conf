# The Google Pixel 4a. Its SoC layer is xnu_kernel_qcom_common until a second Qualcomm SoC shows what differs.
device sunfish
	title	Google Pixel 4a (sunfish)
	vendor	google
	soc	sm7150
	defconfig	sunfish_defconfig
	cmdline	debug=0xc serial=3 cpus=8 keepsyms=1 -enable_kprintf_spam -noprogress rd=ufsroot0 unentitled_ios_sim_launch=1 ignition_level=1 wdt_test=no_user_checkin ufsrw=1 rootrw=1 launchd_unsecure_cache=1 wdt=-1 ufswake=1 sweetfts=1 sweetftspower=1 sweettouchdelay=20 sweetlog=0
	adt	--highmem --sunfish
	status build build-only: nobody here owns this phone; the kernel builds and has not been run by us
